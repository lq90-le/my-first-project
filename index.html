
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My To-Do List</h1>
    
<p id="welcomeMessage">Welcome! Ready to organize your day?</p>
    
<p id="liveClock">Loading time...</p>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>

    <input id="taskInput" type="text"
           placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>
<button onclick="clearAllTasks()">Clear All</button>

<p id="taskProgress">Completed: 0 | Remaining: 0</p>

<div id="progressBar" style="background-color: #dbeafe; height: 10px; border-radius: 5px; max-width: 400px; margin: 10px auto;">
    <div id="progressFill" style="background-color: #16a34a; height: 10px; width: 0%; border-radius: 5px;"></div>
</div>

    <p id="totalTasks">Total tasks: 0</p>

    
<div>
    <button onclick="filterTasks('all')">All</button>
    <button onclick="filterTasks('active')">Active</button>
    <button onclick="filterTasks('completed')">Completed</button>
</div>

    
<input id="searchInput" type="text" placeholder="Search tasks..." oninput="searchTasks()">
    
<select id="sortOrder" onchange="displayTasks()">
    <option value="az">Sort: A to Z</option>
    <option value="za">Sort: Z to A</option>
</select>
    <ul id="taskList"></ul>

    
<div id="editPopup" class="popup">
    <div class="popup-content">
        <h2>Edit Task</h2>
        <input id="editTaskInput" type="text" placeholder="Enter task">
        <div>
            <button onclick="saveEditedTask()">Save</button>
            <button onclick="closeEditPopup()">Cancel</button>
        </div>
    </div>
</div>
    
<div id="clearPopup" class="popup">
    <div class="popup-content">
        <h2>Clear All Tasks?</h2>
        <p>Are you sure you want to delete all tasks?</p>
        <div>
            <button onclick="confirmClearAll()">Yes, Clear All</button>
            <button onclick="closeClearPopup()">Cancel</button>
        </div>
    </div>
</div>

<div id="messagePopup" class="popup">
    <div class="popup-content">
        <h2 id="messageTitle">Notice</h2>
        <p id="messageText"></p>
        <button onclick="closeMessagePopup()">OK</button>
    </div>
</div>    

    <script src="app.js"></script>
</body>
</html>
